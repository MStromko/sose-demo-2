<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <section class="timer-card" aria-label="Pomodoro Timer">
      <h1 id="time-display">25:00</h1>

      <div class="controls" aria-label="Ovládanie časovača">
        <button id="btn-start" type="button">Start</button>
        <button id="btn-pause" type="button">Pause</button>
        <button id="btn-reset" type="button">Reset</button>
      </div>

      <p id="cycle-count">Dokončené cykly: 0</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
